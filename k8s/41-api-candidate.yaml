# The candidate: a second Deployment with its OWN Service and its OWN collection (rahbar_c200, built by
# jobs/ingest-candidate.yaml). The evaluation Job is run against it; only if the release gate passes is the
# live Deployment `api` rolled to the same settings. Reads only, like `api`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
  namespace: ragops
  labels: {app: api-candidate, app.kubernetes.io/part-of: ragops}
spec:
  replicas: 1
  selector: {matchLabels: {app: api-candidate}}
  template:
    metadata: {labels: {app: api-candidate, app.kubernetes.io/part-of: ragops}}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ragops:v1
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: ragops-config}}]
          env:
            - {name: CHROMA_COLLECTION, value: rahbar_c200}     # the candidate's own collection
            - {name: TRACE_DIR, value: /traces/candidate}
          startupProbe: {httpGet: {path: /healthz, port: 8000}, failureThreshold: 30, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 20}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: traces, mountPath: /traces}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: traces, persistentVolumeClaim: {claimName: ragops-traces}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: api-candidate, namespace: ragops, labels: {app: api-candidate}}
spec:
  type: ClusterIP
  selector: {app: api-candidate}
  ports: [{name: http, port: 8000, targetPort: 8000}]
