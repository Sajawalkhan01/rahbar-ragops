# The live API. It only READS the index: no RAGOPS_ROLE, no mount of the data volume. Traces go to stdout
# (kubectl logs) and to the traces volume (one file per pod). maxUnavailable: 0 = a rollout never removes a
# ready pod before its replacement is ready (assignment F3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ragops
  labels: {app: api, app.kubernetes.io/part-of: ragops}
  annotations: {kubernetes.io/change-cause: "baseline: collection rahbar (chunks 400/50)"}
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector: {matchLabels: {app: api}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata: {labels: {app: api, app.kubernetes.io/part-of: ragops}}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ragops:v1
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: ragops-config}}]
          startupProbe: {httpGet: {path: /healthz, port: 8000}, failureThreshold: 30, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 20, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, periodSeconds: 10, failureThreshold: 3}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: traces, mountPath: /traces}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: traces, persistentVolumeClaim: {claimName: ragops-traces}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: ragops, labels: {app: api}}
spec:
  type: ClusterIP
  selector: {app: api}
  ports: [{name: http, port: 8000, targetPort: 8000}]
