# The deliberately bad candidate (top_k 1, relevance floor 0.90) evaluated and gated. Expected: gate FAIL,
# Job Failed, nothing released. Uses the live collection, so it needs no re-ingestion.
apiVersion: batch/v1
kind: Job
metadata:
  name: eval-candidate-bad
  namespace: ragops
  labels: {app: eval, app.kubernetes.io/part-of: ragops}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: eval, app.kubernetes.io/part-of: ragops}}
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: eval
          image: ragops:v1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - >-
              python -m ragops.evaluation.suite --label candidate-bad
              --experiment experiments/candidate/candidate-bad.yaml --repeat 1
              --gate-against "$(ls -t /results/suite-baseline-*.json | head -1)"
          envFrom: [{configMapRef: {name: ragops-config}}]
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: results, mountPath: /results}
            - {name: traces, mountPath: /traces}
            - {name: thresholds, mountPath: /app/config/release_thresholds.yaml, subPath: release_thresholds.yaml, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: results, persistentVolumeClaim: {claimName: ragops-results}}
        - {name: traces, persistentVolumeClaim: {claimName: ragops-traces}}
        - {name: thresholds, configMap: {name: release-thresholds}}
        - {name: tmp, emptyDir: {}}
