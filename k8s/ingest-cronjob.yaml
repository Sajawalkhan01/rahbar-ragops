# The same ingestion on a schedule: picks up whatever has arrived in /data/inbox/incoming. Re-running on an
# unchanged inbox embeds zero chunks. concurrencyPolicy: Forbid = never two writers at once.
apiVersion: batch/v1
kind: CronJob
metadata: {name: ingest-cron, namespace: ragops, labels: {app: ingest, app.kubernetes.io/part-of: ragops}}
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 5400
      template:
        metadata: {labels: {app: ingest, app.kubernetes.io/part-of: ragops}}
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: ingest
              image: ragops:v1
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "ragops.ingestion", "run", "--inbox", "/data/inbox/incoming", "--label", "cron"]
              envFrom: [{configMapRef: {name: ragops-config}}]
              env:
                - {name: RAGOPS_ROLE, value: ingestor}
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {cpu: "1", memory: 1536Mi}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: results, mountPath: /results}
                - {name: traces, mountPath: /traces}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: data, persistentVolumeClaim: {claimName: ragops-data}}
            - {name: results, persistentVolumeClaim: {claimName: ragops-results}}
            - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
            - {name: traces, emptyDir: {sizeLimit: 50Mi}}   # ingestion writes no traces; Paths.ensure() only needs the folder to exist
