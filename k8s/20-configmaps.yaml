# ragops-config: environment for every pod (API, ingestion, evaluation), so the embedding pin is stated ONCE.
# release-thresholds: the release gate's thresholds, mounted as a FILE into the evaluation Jobs.
# Edit it with `kubectl edit configmap release-thresholds -n ragops`, rerun the evaluation Job, and the
# verdict changes without rebuilding any image (assignment F2).
apiVersion: v1
kind: ConfigMap
metadata: {name: ragops-config, namespace: ragops}
data:
  EMBED_MODEL: "nomic-embed-text"
  RETRIEVER: "chroma"
  LLM_PROVIDER: "extractive"           # extractive | ollama-host (slow on CPU: ~1.5 tokens/s measured) | stub
  LLM_MODEL: "llama3.2:3b"
  TEMPERATURE: "0.1"
  TOP_K: "5"
  RELEVANCE_FLOOR: "0.70"
  CACHE_ENABLED: "true"
  CACHE_THRESHOLD: "0.94"
  CACHE_TTL_SECONDS: "86400"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  RAGOPS_DATA_DIR: "/data"
  RAGOPS_RESULTS_DIR: "/results"
  RAGOPS_TRACE_DIR: "/traces"
  TRACE_DIR: "/traces"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: release-thresholds, namespace: ragops}
data:
  release_thresholds.yaml: |
    # Part C2 release gate thresholds. vs_baseline: deltas against the baseline run. absolute: floors/ceilings.
    vs_baseline:
      max_recall5_drop: 0.02
      max_mrr_drop: 0.03
      max_ndcg5_drop: 0.03
      max_answer_correctness_drop: 0.05
      min_abstention_delta: 0.0
    absolute:
      min_faithfulness: 0.90
      min_citation_validity: 0.95
      min_answer_correctness: 0.50
      max_p95_latency_ms: 2000
